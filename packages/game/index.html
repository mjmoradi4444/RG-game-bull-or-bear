<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101830" />
    <meta name="description" content="Rebate Rush — win or lose, the rebate pays. A RebateGain arcade game." />
    <title>Rebate Rush — RebateGain</title>
    <link rel="icon" type="image/png" href="/brand/Logo1.png" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #101830;
        color: #ffffff;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; }
      #game { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>

</html>
